stages: [lint, test, images, release]

default:
  image: rust:1.96.0-bookworm
  tags: [saas-linux-small-amd64]
  interruptible: true

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.0
  # pull-push on the default branch only (rules below): merge requests and tags start from the
  # main cache and upload nothing.
  CARGO_CACHE_POLICY: pull

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Inputs of each job for `rules:changes`. Merge requests compare with main, pushes to main with
# the previous push. Pipelines started without a push (web, API) run every job; tags run lint,
# deny and test, release tags X.Y.Z also lane-bootstrap, the cli image and the release.
.paths:
  test: &test-paths
    - Cargo.toml
    - Cargo.lock
    - rust-toolchain.toml
    - crates/**/*
    - config.example.json
    - test/config.fake.json
    - .gitlab-ci.yml
  lint: &lint-paths
    - Cargo.toml
    - Cargo.lock
    - rust-toolchain.toml
    - crates/**/*
    - config.example.json
    - test/config.fake.json
    - .gitlab-ci.yml
    - scripts/**/*
    - images/**/*.sh
    - images/**/Dockerfile
  deny: &deny-paths
    - Cargo.toml
    - Cargo.lock
    - crates/*/Cargo.toml
    - deny.toml
    - scripts/ci-install-cargo-deny.sh
    - .gitlab-ci.yml
  lane-bootstrap: &lane-bootstrap-paths
    - crates/core/src/lane-bootstrap.sh
    - crates/core/src/lane.rs
    - crates/core/src/cloud_init.rs
    - images/test/lane-bootstrap.sh
    - .gitlab-ci.yml
  cli-image: &cli-image-paths
    - Cargo.toml
    - Cargo.lock
    - crates/*/Cargo.toml
    - crates/*/build.rs
    - crates/*/src/**/*
    - images/cli/**/*
    - images/test/smoke.sh
    - scripts/check-static-elf.sh
    - scripts/ci-push-image.sh
    - .gitlab-ci.yml

lint:
  stage: lint
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *lint-paths
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lint-paths
      variables:
        CARGO_CACHE_POLICY: pull-push
  cache:
    key: lint-$CI_COMMIT_REF_SLUG
    fallback_keys: [lint-main]
    paths: [.cargo/registry/, .cargo/git/, target/]
    policy: $CARGO_CACHE_POLICY
  script:
    - scripts/check-pins.sh
    - apt-get update && apt-get install -y --no-install-recommends shellcheck
    - scripts/shellcheck.sh
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --all-features -- -D warnings

deny:
  stage: lint
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *deny-paths
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *deny-paths
      variables:
        CARGO_CACHE_POLICY: pull-push
  cache:
    key: deny-$CI_COMMIT_REF_SLUG
    fallback_keys: [deny-main]
    paths: [.cargo/bin/, .cargo/registry/, .cargo/git/]
    policy: $CARGO_CACHE_POLICY
  script:
    - scripts/ci-install-cargo-deny.sh
    - cargo deny check

test:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *test-paths
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *test-paths
      variables:
        CARGO_CACHE_POLICY: pull-push
  variables:
    # The hosted small runner's disk does not hold the full debug info of every test binary.
    CARGO_PROFILE_DEV_DEBUG: line-tables-only
    CARGO_INCREMENTAL: "0"
  cache:
    key: test-lines-$CI_COMMIT_REF_SLUG
    fallback_keys: [test-lines-main]
    paths: [.cargo/registry/, .cargo/git/, target/]
    policy: $CARGO_CACHE_POLICY
  script:
    - cargo test --workspace --all-features

# Jobs that run containers, on a Docker-in-Docker daemon.
.docker:
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash

# Runs the lane bootstrap in the images of images/test/lane-bootstrap.sh.
lane-bootstrap:
  extends: .docker
  stage: test
  needs: []
  timeout: 15 minutes
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *lane-bootstrap-paths
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lane-bootstrap-paths
  script:
    - images/test/lane-bootstrap.sh

# Builds and smoke-tests the cli image; pushes it on main and on release tags only
# (scripts/ci-push-image.sh), so merge requests build and test without pushing.
image:cli:
  extends: .docker
  stage: images
  needs:
    - job: test
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *cli-image-paths
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *cli-image-paths
  script:
    - images/test/smoke.sh "ciburst-ci/cli:$CI_COMMIT_SHORT_SHA"
    - scripts/ci-push-image.sh "ciburst-ci/cli:$CI_COMMIT_SHORT_SHA"

.release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

release:binary:
  extends: .release
  script:
    - scripts/ci-release-binary.sh
  artifacts:
    paths: [dist/, release-notes.md]
    expire_in: 1 week

# The `release` keyword, not `glab release create`: only its releases become versions in the
# CI/CD Catalog (D71).
release:
  extends: .release
  image: registry.gitlab.com/gitlab-org/cli:v1.124.0
  needs: [release:binary, image:cli]
  variables:
    PACKAGE_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ciburst/$CI_COMMIT_TAG
  script:
    - echo "release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: ciburst $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: ciburst-x86_64-unknown-linux-musl
          url: $PACKAGE_URL/ciburst-x86_64-unknown-linux-musl
          link_type: package
        - name: ciburst-x86_64-unknown-linux-musl.sha256
          url: $PACKAGE_URL/ciburst-x86_64-unknown-linux-musl.sha256
          link_type: other
        - name: ciburst-vm-agent-x86_64-unknown-linux-musl
          url: $PACKAGE_URL/ciburst-vm-agent-x86_64-unknown-linux-musl
          link_type: package
        - name: ciburst-vm-agent-x86_64-unknown-linux-musl.sha256
          url: $PACKAGE_URL/ciburst-vm-agent-x86_64-unknown-linux-musl.sha256
          link_type: other
