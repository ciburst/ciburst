stages: [lint, test, images, release]

default:
  image: rust:1.96.0-bookworm
  tags: [saas-linux-small-amd64]
  interruptible: true

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.0

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.rust:
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo/registry/, .cargo/git/, .cargo/bin/, target/]

lint:
  extends: .rust
  stage: lint
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --all-features -- -D warnings
    - apt-get update && apt-get install -y --no-install-recommends shellcheck
    - scripts/shellcheck.sh

deny:
  extends: .rust
  stage: lint
  script:
    - scripts/ci-install-cargo-deny.sh
    - cargo deny check

test:
  extends: .rust
  stage: test
  script:
    - cargo test --workspace --all-features

.image:
  stage: images
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/**/*, .gitlab-ci.yml]
  before_script:
    - apk add --no-cache bash
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - images/test/smoke.sh "$IMAGE" "ciburst-ci/$IMAGE:$CI_COMMIT_SHORT_SHA"
    - scripts/ci-push-image.sh "ciburst-ci/$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE"

image:base:
  extends: .image
  variables:
    IMAGE: base

image:node:
  extends: .image
  variables:
    IMAGE: node

image:rust:
  extends: .image
  variables:
    IMAGE: rust

image:playwright:
  extends: .image
  variables:
    IMAGE: playwright

image:kaniko:
  extends: .image
  variables:
    IMAGE: kaniko

.release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

release:binary:
  extends: .release
  script:
    - scripts/ci-release-binary.sh
  artifacts:
    paths: [dist/, release-notes.md]
    expire_in: 1 week

release:
  extends: .release
  image: registry.gitlab.com/gitlab-org/cli:v1.124.0
  needs: [release:binary, image:base, image:node, image:rust, image:playwright, image:kaniko]
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    BINARY: ciburst-x86_64-unknown-linux-musl
    PACKAGE_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ciburst/$CI_COMMIT_TAG
  script:
    - |
      glab release create "$CI_COMMIT_TAG" --name "ciburst $CI_COMMIT_TAG" --notes-file release-notes.md \
        --assets-links="[{\"name\":\"${BINARY}\",\"url\":\"${PACKAGE_URL}/${BINARY}\",\"link_type\":\"package\"},{\"name\":\"${BINARY}.sha256\",\"url\":\"${PACKAGE_URL}/${BINARY}.sha256\",\"link_type\":\"other\"}]"
