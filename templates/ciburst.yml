# ciburst CI/CD component. Every job of the including pipeline without its own `tags` runs on
# the VM runner `vm_tag`: a VM with its own Docker daemon and GitLab's Docker executor, so
# `image:`, `services:` and Docker-in-Docker work as on GitLab's hosted runners. A job tagged
# with a lane of this project's own `ciburst.json` runs in that lane. The manual jobs
# `ciburst-setup`, `ciburst-check`, `ciburst-destroy` and `ciburst-invite` run `ciburst --ci` on
# a hosted runner, on the default branch when it is protected. With `role: member` a project
# joins the fleet of another project instead, through the manual jobs `ciburst-join` and
# `ciburst-leave`; `ciburst-join` reads the member's own `ciburst.json` for its lanes.
#
# Usage. A release include (`@1`, `@1.2`, `@1.2.3`) runs the cli image of that release; an include
# by branch or SHA (`@main`) runs the cli image `version`, `edge` by default.
#
# include:
#   - component: gitlab.com/ciburst/ciburst/ciburst@1
#     inputs:
#       vm_tag: vm
#
# test:
#   image: node:24
#   services: [postgres:16]
#   variables:
#     POSTGRES_PASSWORD: example
#   script:
#     - npm ci
#     - npm test
#
# container-image:
#   extends: .ciburst-docker
#   stage: build
#   script:
#     - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
#     - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
#
# hosted:
#   tags: [saas-linux-small-amd64]
#   image: alpine:3.22
#   script:
#     - echo "runs on a GitLab hosted runner"

spec:
  component: [version]
  inputs:
    vm_tag:
      description: Runner tag of the VM runner, which runs every job without its own `tags`.
      default: vm
    version:
      description: >-
        Tag of the image registry.gitlab.com/ciburst/ciburst/cli for the ciburst jobs when the
        component is included by a branch or a SHA; a release include runs its own version.
      default: edge
    hosted_tag:
      description: Runner tag of the GitLab hosted runner for the ciburst jobs.
      default: saas-linux-small-amd64
    role:
      description: "`host` sets ciburst up in this project; `member` joins the fleet of a host."
      default: host
      options: [host, member]
---
default:
  tags:
    - $[[ inputs.vm_tag ]]

.ciburst-docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# The cli image is the component's release (`component.version`). Included by a branch or a SHA,
# the version is empty (YAML null as a whole value, refused in `rules:variables`), so it sits in
# the job's variables and each role's first rule replaces it with the input (D71).
ciburst-setup: &ciburst-job
  stage: .pre
  image: registry.gitlab.com/ciburst/ciburst/cli:$CIBURST_CLI_TAG
  tags:
    - $[[ inputs.hosted_tag ]]
  environment:
    name: ciburst
    action: prepare
  resource_group: ciburst
  interruptible: false
  variables:
    CIBURST_CLI_TAG: "$[[ component.version ]]"
  rules:
    - if: '"$[[ inputs.role ]]" == "host" && "$[[ component.version ]]" == "" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        CIBURST_CLI_TAG: "$[[ inputs.version ]]"
      when: manual
      allow_failure: true
    - if: '"$[[ inputs.role ]]" == "host" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - ciburst --ci apply

ciburst-check:
  <<: *ciburst-job
  script:
    - ciburst --ci check

ciburst-destroy:
  <<: *ciburst-job
  script:
    - ciburst --ci destroy --yes "$CIBURST_DESTROY"

ciburst-invite:
  <<: *ciburst-job
  script:
    - ciburst --ci invite

ciburst-join: &ciburst-member-job
  <<: *ciburst-job
  rules:
    - if: '"$[[ inputs.role ]]" == "member" && "$[[ component.version ]]" == "" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        CIBURST_CLI_TAG: "$[[ inputs.version ]]"
      when: manual
      allow_failure: true
    - if: '"$[[ inputs.role ]]" == "member" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - ciburst --ci join

ciburst-leave:
  <<: *ciburst-member-job
  script:
    - ciburst --ci leave
