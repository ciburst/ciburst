[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/scaleway", "crates/dispatch-scaleway", "crates/vm-agent"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
http = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
