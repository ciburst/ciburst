# ciburst consumer include. Every job runs on the VM pool `vm`: a VM with its own Docker daemon
# and GitLab's Docker executor, so `image:`, `services:`, Docker-in-Docker and image builds work
# as on GitLab's hosted runners. Fast lanes on Serverless Jobs start sooner but have no Docker
# daemon and ignore `image:`; a job joins one by extending its template, which sets the stage
# and the tag. The dispatcher picks the pool from the job's stage, so jobs on `vm` use stages
# that no fast lane lists.
#
# Examples:
#
# test:
#   image: node:24
#   services: [postgres:16]
#   variables:
#     POSTGRES_PASSWORD: example
#   script:
#     - npm ci
#     - npm test
#
# clippy:
#   extends: .ciburst-rust
#   script:
#     - cargo clippy --all-targets -- -D warnings
#
# e2e:
#   extends: .ciburst-playwright
#   script:
#     - npm ci
#     - npx playwright test
#
# container-image:
#   extends: .ciburst-image-build
#   script:
#     - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
#     - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
#
# The same build on a GitLab hosted runner: add `tags: [saas-linux-small-amd64]`.

default:
  tags: [vm]

.ciburst-rust:
  stage: rust
  tags: [rust]

.ciburst-playwright:
  stage: e2e
  tags: [playwright]

.ciburst-image-build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
