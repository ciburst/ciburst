# ciburst consumer include. Jobs run in the ci pool unless they extend a pool template.
# The job's stage selects the pool; the template sets the matching stage and tag.
# The `image:` keyword is ignored in every pool.
#
# Examples:
#
# clippy:
#   extends: .ciburst-rust
#   script:
#     - cargo clippy --all-targets -- -D warnings
#
# e2e:
#   extends: .ciburst-playwright
#   script:
#     - npm ci
#     - npx playwright test
#
# container-image:
#   extends: .ciburst-image-build
#   script:
#     - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
#     - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
#
# compose-test:
#   stage: test
#   tags: [saas-linux-small-amd64]
#   image: docker:27.5.1
#   services: [docker:27.5.1-dind]
#   variables:
#     DOCKER_TLS_CERTDIR: "/certs"
#   script:
#     - docker compose up --abort-on-container-exit

default:
  tags: [ci]

.ciburst-rust:
  stage: rust
  tags: [rust]

.ciburst-playwright:
  stage: e2e
  tags: [playwright]

.ciburst-image-build:
  stage: build
  tags: [saas-linux-small-amd64]
  image: docker:27.5.1
  services: [docker:27.5.1-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
