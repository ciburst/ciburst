[package]
name = "ciburst-scaleway"
description = "Scaleway implementation of the ciburst ports: Instances and Serverless Jobs provider, Serverless Function host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The in-process Scaleway API fakes, for tests of this and other crates.
testing = ["ciburst-core/testing"]

[dependencies]
async-trait.workspace = true
ciburst-core = { path = "../core", version = "0.1.0" }
hex.workspace = true
hmac.workspace = true
md-5 = "0.10"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["time"] }

[build-dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
ciburst-scaleway = { path = ".", features = ["testing"] }
tempfile.workspace = true
yaml-rust2 = { version = "0.13.0", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ciburst_embedded_code)"] }
