[package]
name = "ciburst-scaleway"
description = "Scaleway implementation of the ciburst ports: Serverless Jobs provider and Serverless Function host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
ciburst-core = { path = "../core", version = "0.1.0" }
hex.workspace = true
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["time"] }

[build-dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ciburst_embedded_code)"] }
