[package]
name = "ciburst-core"
description = "Core of ciburst: config, dispatcher, GitLab client, provisioning and the provider and host contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]
# The contract harness and the GitLab fake, for tests of this and other crates.
testing = []

[dependencies]
async-trait.workspace = true
rand.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
ciburst-core = { path = ".", features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
