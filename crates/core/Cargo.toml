[package]
name = "ciburst-core"
description = "Core of ciburst: config, dispatcher, GitLab client, provisioning and the provider and host contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]
# The contract harness and the GitLab fake, for tests of this and other crates.
testing = []
# `check` of pipelines: reads GitLab's merged YAML. The dispatcher does without it.
pipeline = ["dep:yaml-rust2"]

[dependencies]
async-trait.workspace = true
rand.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
yaml-rust2 = { version = "0.13.0", default-features = false, optional = true }

[dev-dependencies]
ciburst-core = { path = ".", features = ["pipeline", "testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
