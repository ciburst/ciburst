[package]
name = "ciburst"
description = "Serverless per-job GitLab runners with pluggable providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ciburst"
path = "src/main.rs"

[dependencies]
ciburst-core = { path = "../core", version = "1.0.0", features = ["pipeline"] }
ciburst-scaleway = { path = "../scaleway", version = "1.0.0" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
async-trait.workspace = true
ciburst-core = { path = "../core", version = "1.0.0", features = ["pipeline", "testing"] }
tempfile.workspace = true
