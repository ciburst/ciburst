[package]
name = "ciburst"
description = "Serverless per-job GitLab runners with pluggable providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ciburst"
path = "src/main.rs"

[dependencies]
ciburst-core = { path = "../core", version = "0.1.0" }
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
ciburst-core = { path = "../core", version = "0.1.0", features = ["testing"] }
tempfile.workspace = true
