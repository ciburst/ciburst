[package]
name = "ciburst-vm-agent"
description = "Supervisor on a ciburst VM: runner slots, state reports, drain and self-termination through the dispatcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ciburst-vm-agent"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
ciburst-core = { path = "../core", version = "0.1.0" }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "process"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }
