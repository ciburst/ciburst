[package]
name = "ciburst-vm-agent"
description = "Supervisor on a ciburst VM: runner slots, state reports, drain and self-termination through the dispatcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ciburst-vm-agent"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
axum.workspace = true
ciburst-core = { path = "../core", version = "1.0.0" }
futures-util = { version = "0.3", default-features = false }
reqwest = { workspace = true, features = ["stream"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "process", "net"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true
