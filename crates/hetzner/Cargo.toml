[package]
name = "ciburst-hetzner"
description = "Hetzner Cloud implementation of the ciburst provider port: VM pools on cloud servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The in-process Hetzner API fake, for tests of this and other crates.
testing = ["ciburst-core/testing"]

[dependencies]
async-trait.workspace = true
ciburst-core = { path = "../core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
ciburst-hetzner = { path = ".", features = ["testing"] }
